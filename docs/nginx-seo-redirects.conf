# ==============================================================================
# ConvertAllNow — Nginx Production SEO & Redirect Configuration
# ==============================================================================

# 1. Permanent 301 Redirect: www.convertallnow.com -> convertallnow.com
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.convertallnow.com;

    # SSL certificates (use your certbot or SSL path)
    # ssl_certificate /etc/letsencrypt/live/convertallnow.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/convertallnow.com/privkey.pem;

    # 301 Permanent Redirect preserving full URI and query strings
    return 301 https://convertallnow.com$request_uri;
}

# 2. HTTP -> HTTPS Redirect for canonical non-www
server {
    listen 80;
    server_name convertallnow.com;
    return 301 https://convertallnow.com$request_uri;
}

# 3. Main Canonical Server Block
server {
    listen 443 ssl http2;
    server_name convertallnow.com;

    # SSL certificates
    # ssl_certificate /etc/letsencrypt/live/convertallnow.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/convertallnow.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy to Next.js (port 3000 or standalone port)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
