<svg width="512" height="512" viewBox="26 114 460 312" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="themeGradient" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Continuous Infinity Ribbon -->
  <path d="M 256 256 
           C 330 150 450 150 450 256 
           C 450 362 330 362 256 256 
           C 182 150 62 150 62 256 
           C 62 362 182 362 256 256" 
        fill="none" 
        stroke="url(#themeGradient)" 
        stroke-width="72" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#shadow)" />

  <!-- 2. Play Button (Left Loop) -->
  <path d="M 142 228 L 178 256 L 142 284 Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linejoin="round" 
        filter="url(#iconShadow)" />

  <!-- 3. Document Icon (Right Loop) -->
  <g filter="url(#iconShadow)">
    <path d="M 336 216 L 364 216 L 388 240 L 388 288 C 388 292 384 296 380 296 L 336 296 C 332 296 328 292 328 288 L 328 224 C 328 220 332 216 336 216 Z" 
          fill="#FFFFFF" />
    <path d="M 364 216 L 364 240 L 388 240 Z" fill="#E2E8F0" />
    <rect x="340" y="248" width="36" height="8" rx="4" fill="#3B82F6" />
    <rect x="340" y="272" width="24" height="8" rx="4" fill="#3B82F6" />
  </g>
</svg>
